name: Convert Files MSIX build to MSI

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  convert:
    runs-on: windows-2022
    env:
      SRC_RUN: '44730718264'
      OUT_DIR: '${{ github.workspace }}\msiout'
      UNPK_DIR: '${{ github.workspace }}\unpacked'
      MSI_NAME: 'Files-4.3.0.0-x64.msi'

    steps:
    - name: Checkout repo (for product.wxs)
      uses: actions/checkout@v4

    - name: Download build artifact (internal)
      uses: actions/download-artifact@v4
      with:
        name: Files-4.3-sideload-x64
        run-id: ${{ env.SRC_RUN }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: artifact

    - name: Locate MSIX and unpack payload with MakeAppx
      shell: pwsh
      run: |
        $msix = Get-ChildItem "$env:GITHUB_WORKSPACE\artifact" -Recurse -Filter "Files.App_*.msix" | Where-Object { $_.FullName -notmatch 'Dependencies' } | Select-Object -First 1
        if (-not $msix) { throw "Main MSIX not found" }
        Write-Host "Using MSIX: $($msix.FullName)"
        New-Item -ItemType Directory -Force -Path "$env:UNPK_DIR" | Out-Null
        $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $makeappx) { $makeappx = Get-ChildItem "C:\Program Files\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 }
        if (-not $makeappx) { throw "makeappx.exe not found" }
        Write-Host "MakeAppx: $($makeappx.FullName)"
        & $makeappx.FullName unpack /p "$($msix.FullName)" /d "$env:UNPK_DIR"
        if ($LASTEXITCODE -ne 0) { throw "MakeAppx unpack failed" }
        Write-Host "=== unpacked top level ==="
        Get-ChildItem "$env:UNPK_DIR" | ForEach-Object { Write-Host $_.Name }

    - name: Install WiX Toolset (v5, no OSMF fee)
      shell: pwsh
      run: |
        dotnet tool install --global wix --version 5.0.2
        wix --version

    - name: Harvest files into WiX authoring
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "$env:OUT_DIR" | Out-Null
        wix extension add WixToolset.UI.wixext
        wix heat dir "$env:UNPK_DIR" -cg AppFiles -dr INSTALLFOLDER -gg -scom -sfrag -sreg -out "$env:OUT_DIR\harvest.wxs"
        if ($LASTEXITCODE -ne 0) { throw "heat failed" }
        Copy-Item "$env:GITHUB_WORKSPACE\product.wxs" "$env:OUT_DIR\product.wxs" -Force
        Write-Host "product.wxs + harvest.wxs ready"

    - name: Build MSI
      shell: pwsh
      run: |
        wix build "$env:OUT_DIR\product.wxs" "$env:OUT_DIR\harvest.wxs" -ext WixToolset.UI.wixext -out "$env:OUT_DIR\$env:MSI_NAME"
        if ($LASTEXITCODE -ne 0) { throw "wix build failed" }
        Get-ChildItem "$env:OUT_DIR" -Filter *.msi | ForEach-Object { Write-Host "MSI: $($_.FullName) [$($_.Length)]" }

    - name: Upload MSI artifact
      uses: actions/upload-artifact@v4
      with:
        name: Files-MSI-x64
        path: ${{ env.OUT_DIR }}\*
        if-no-files-found: error
